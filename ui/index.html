<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Hussein Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="newtab" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="toolbar">
    <button id="back" title="Back">&#8592;</button>
    <button id="forward" title="Forward">&#8594;</button>
    <button id="reload" title="Reload">&#8635;</button>
    <button id="home" title="Home">&#8962;</button>
    <form id="addr-form">
      <input id="address" spellcheck="false" placeholder="Search or enter address">
    </form>
    <div class="tools">
      <button id="tool-unwall" class="tool" title="Remove walls / overlays (Ctrl+Shift+X)"><svg viewBox="0 0 24 24"><path d="M3 5h8v4H3zM13 5h8v4h-8zM3 11h4v4H3zM9 11h6v4H9zM17 11h4v4h-4zM3 17h8v2H3z" fill="currentColor" opacity=".55"/><path d="M14 15l6 6M20 15l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button id="tool-hide" class="tool" title="Hide an element: click this, then click what to hide (Ctrl+Shift+H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.6 6.6C4.3 8 2.7 10.2 2 12c1 2.5 5 7 10 7 1.7 0 3.3-.5 4.6-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
      <button id="tool-screenshot" class="tool" title="Screenshot: saves to Pictures and copies (Ctrl+Shift+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    </div>
    <button id="shield" title="Ad blocking"><span id="shield-icon">&#128737;</span> <span id="count">0</span></button>
  </div>
  <div id="toast" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
